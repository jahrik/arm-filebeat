---
name: Build

on:
  pull_request:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: extractions/setup-just@v3

      - name: Test building image.
        run: just build test-image

      - name: Verify the image works.
        run: docker run --rm test-image version

      - name: Validate filebeat.yml.
        run: |
          docker run --rm \
            -v "$PWD/filebeat.yml:/usr/share/filebeat/filebeat.yml:ro" \
            -e ELASTICSEARCH_HOST=elasticsearch -e KIBANA_HOST=kibana \
            test-image test config --strict.perms=false

  release:
    name: Release
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v5
      - uses: extractions/setup-just@v3
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Login to DockerHub
        run: just login docker.io "${{ secrets.DOCKERHUB_USERNAME }}" "${{ secrets.DOCKERHUB_TOKEN }}"

      - name: Build and push image.
        run: just release ${{ github.repository }}:latest
