#========================== Modules configuration =============================
filebeat.modules:

#------------------------------- System Module -------------------------------
- module: system
  syslog:
    enabled: true
    var.paths: ["/var/log/syslog*"]
  auth:
    enabled: true
    var.paths: ["/var/log/auth.log*"]

#=========================== Filebeat inputs ==================================
# Container logs (replaces the removed `type: docker` input from 5.x/6.x)
filebeat.inputs:
- type: filestream
  id: container-logs
  enabled: true
  paths:
    - /var/lib/docker/containers/*/*.log
  prospector.scanner.symlinks: true
  parsers:
    - container: ~
  processors:
    - add_docker_metadata: ~
    - add_locale: ~

#========================== Elasticsearch output ==============================
output.elasticsearch:
  hosts: ["${ELASTICSEARCH_HOST}:9200"]

#============================== Dashboards ====================================
setup.dashboards:
  enabled: true
setup.kibana:
  host: "${KIBANA_HOST}:5601"
